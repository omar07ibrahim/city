[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanlens"
dynamic = ["version"]
description = "Auditable geospatial search over a frozen world-cities snapshot"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Omar Ibrahim" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.13,<2",
  "ruff>=0.8,<1",
]

[project.scripts]
urbanlens-audit = "urbanlens.audit:main"

[project.urls]
Repository = "https://github.com/omar07ibrahim/city"

[tool.setuptools.dynamic]
version = { attr = "urbanlens.__version__" }

[tool.setuptools.packages.find]
include = ["urbanlens*"]

[tool.setuptools.package-data]
urbanlens = ["py.typed"]

[tool.coverage.run]
branch = true
source = ["urbanlens"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
