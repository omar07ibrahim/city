<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" fill="#172033" role="img" aria-labelledby="edge-title edge-description">
  <title id="edge-title">Real geographic edge cases with exact oracle proof</title>
  <desc id="edge-description">Three source-bound cards show a real zero-distance co-location tie, positive 180 longitude canonicalized to minus 180 at the antimeridian, and longitude collapsed to zero at the north pole. Every accelerated ordered top-three result matches full scan.</desc>
