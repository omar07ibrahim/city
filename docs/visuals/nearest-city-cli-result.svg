  <title id="cli-title">Actual verified nearest-city CLI result</title>
  <desc id="cli-description">A terminal-style rendering of selected fields parsed from the actual nearest-city subprocess receipt for latitude minus 11.1 and longitude minus 77.6. It shows two zero-distance results, one third result, traversal counts, oracle match, and exit code zero.</desc>
