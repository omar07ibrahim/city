  <text class="mono" x="558" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">03</text>
  <text x="535" y="330" font-size="14" font-weight="700">Balanced sphere kd-tree</text>
  <line x1="535" y1="351" x2="717" y2="351" stroke="#087F73" stroke-opacity="0.35"/>
  <circle cx="540" cy="388" r="3" fill="#087F73"/>
  <text x="551" y="393" font-size="13" fill="#172033">3D unit-sphere vectors</text>
  <circle cx="540" cy="436" r="3" fill="#087F73"/>
  <text x="551" y="441" font-size="13" fill="#172033">greatest-span axis</text>
  <circle cx="540" cy="484" r="3" fill="#087F73"/>
  <text x="551" y="489" font-size="13" fill="#172033">lower median · stable ID</text>
  <circle cx="540" cy="532" r="3" fill="#087F73"/>
  <text x="551" y="537" font-size="13" fill="#172033">depth 16 · 44,691 nodes</text>
  <text class="mono" x="535" y="610" font-size="10" fill="#536174">unit-sphere kd-tree</text>
  <line x1="737" y1="440" x2="748" y2="440" stroke="#536174" stroke-width="2"/>
  <polygon points="748,440 741,435 741,445" fill="#536174"/>
  <rect x="753" y="242" width="218" height="396" rx="15" fill="#E2F4F1" stroke="#087F73" stroke-width="2"/>
  <rect x="771" y="262" width="46" height="28" rx="14" fill="#087F73"/>
  <text class="mono" x="794" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">04</text>
  <text x="771" y="330" font-size="14" font-weight="700">Conservative AABB</text>
  <line x1="771" y1="351" x2="953" y2="351" stroke="#087F73" stroke-opacity="0.35"/>
  <circle cx="776" cy="388" r="3" fill="#087F73"/>
  <text x="787" y="393" font-size="13" fill="#172033">down-rounded lower bound</text>
  <circle cx="776" cy="436" r="3" fill="#087F73"/>
  <text x="787" y="441" font-size="13" fill="#172033">prune only bound &gt; kth</text>
  <circle cx="776" cy="484" r="3" fill="#087F73"/>
  <text x="787" y="489" font-size="13" fill="#172033">raw chord² + source_id</text>
  <circle cx="776" cy="532" r="3" fill="#087F73"/>
  <text x="787" y="537" font-size="13" fill="#172033">exact · worst case O(n)</text>
  <text class="mono" x="771" y="610" font-size="10" fill="#536174">strict &gt; pruning</text>
  <line x1="973" y1="440" x2="984" y2="440" stroke="#536174" stroke-width="2"/>
  <polygon points="984,440 977,435 977,445" fill="#536174"/>
  <rect x="989" y="242" width="218" height="396" rx="15" fill="#FBF1D8" stroke="#B7791F" stroke-width="2"/>
  <rect x="1007" y="262" width="46" height="28" rx="14" fill="#6F4A0C"/>
  <text class="mono" x="1030" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">05</text>
  <text x="1007" y="330" font-size="14" font-weight="700">Optional full-scan oracle</text>
  <line x1="1007" y1="351" x2="1189" y2="351" stroke="#B7791F" stroke-opacity="0.35"/>
  <circle cx="1012" cy="388" r="3" fill="#B7791F"/>
  <text x="1023" y="393" font-size="13" fill="#172033">scan 44,691 records</text>
  <circle cx="1012" cy="436" r="3" fill="#B7791F"/>
  <text x="1023" y="441" font-size="13" fill="#172033">ordered rank-key proof</text>
  <circle cx="1012" cy="484" r="3" fill="#B7791F"/>
  <text x="1023" y="489" font-size="13" fill="#172033">--verify → match</text>
  <circle cx="1012" cy="532" r="3" fill="#B7791F"/>
  <text x="1023" y="537" font-size="13" fill="#172033">mismatch → fail closed</text>
  <text class="mono" x="1007" y="610" font-size="10" fill="#536174">explicit --verify</text>
  <line x1="1209" y1="440" x2="1220" y2="440" stroke="#536174" stroke-width="2"/>
  <polygon points="1220,440 1213,435 1213,445" fill="#536174"/>
