  <text x="152" y="176" font-size="14" fill="#172033">train.csv · 44,691 rows · 4,734,682 bytes</text>
  <text class="mono" x="82" y="197" font-size="12" fill="#536174">SHA-256 de941def7faca87c0911abb79c3cbd07672887fd486a9b7bea6c48c12ce0cf18</text>
  <text class="mono" x="1404" y="184" text-anchor="end" font-size="12" fill="#536174">urbanlens.data-quality-manifest v3</text>
  <rect x="45" y="242" width="218" height="396" rx="15" fill="#E8F1FA" stroke="#2563A6" stroke-width="2"/>
  <rect x="63" y="262" width="46" height="28" rx="14" fill="#2563A6"/>
  <text class="mono" x="86" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">01</text>
  <text x="63" y="330" font-size="14" font-weight="700">Single capture + audit</text>
  <line x1="63" y1="351" x2="245" y2="351" stroke="#2563A6" stroke-opacity="0.35"/>
  <circle cx="68" cy="388" r="3" fill="#2563A6"/>
  <text x="79" y="393" font-size="13" fill="#172033">regular file · no-follow</text>
  <circle cx="68" cy="436" r="3" fill="#2563A6"/>
  <text x="79" y="441" font-size="13" fill="#172033">same bytes: audit + rows</text>
  <circle cx="68" cy="484" r="3" fill="#2563A6"/>
  <text x="79" y="489" font-size="13" fill="#172033">manifest v3 · PASS</text>
  <circle cx="68" cy="532" r="3" fill="#2563A6"/>
  <text x="79" y="537" font-size="13" fill="#172033">44,691 source rows</text>
  <text class="mono" x="63" y="610" font-size="10" fill="#536174">audit + capture</text>
  <line x1="265" y1="440" x2="276" y2="440" stroke="#536174" stroke-width="2"/>
  <polygon points="276,440 269,435 269,445" fill="#536174"/>
  <rect x="281" y="242" width="218" height="396" rx="15" fill="#E8F1FA" stroke="#2563A6" stroke-width="2"/>
  <rect x="299" y="262" width="46" height="28" rx="14" fill="#2563A6"/>
  <text class="mono" x="322" y="281" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">02</text>
  <text x="299" y="330" font-size="14" font-weight="700">Strict E7 boundary</text>
  <line x1="299" y1="351" x2="481" y2="351" stroke="#2563A6" stroke-opacity="0.35"/>
  <circle cx="304" cy="388" r="3" fill="#2563A6"/>
  <text x="315" y="393" font-size="13" fill="#172033">ASCII decimal · ≤ 7 dp</text>
  <circle cx="304" cy="436" r="3" fill="#2563A6"/>
  <text x="315" y="441" font-size="13" fill="#172033">signed zero → 0</text>
  <circle cx="304" cy="484" r="3" fill="#2563A6"/>
  <text x="315" y="489" font-size="13" fill="#172033">+180 → -180 · poles → 0</text>
  <circle cx="304" cy="532" r="3" fill="#2563A6"/>
  <text x="315" y="537" font-size="13" fill="#172033">scale 10,000,000</text>
  <text class="mono" x="299" y="610" font-size="10" fill="#536174">integer boundary</text>
  <line x1="501" y1="440" x2="512" y2="440" stroke="#536174" stroke-width="2"/>
  <polygon points="512,440 505,435 505,445" fill="#536174"/>
