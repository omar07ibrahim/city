<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" fill="#172033" role="img" aria-labelledby="architecture-title architecture-description">
  <title id="architecture-title">Implemented exact nearest-city architecture</title>
  <desc id="architecture-description">A six-stage implemented workflow from one audited source capture through strict E7 parsing, a balanced unit-sphere kd-tree, conservative AABB pruning, an optional full-scan oracle, and a bounded canonical receipt.</desc>
  <style>
    text { font-family: Arial, Helvetica, Liberation Sans, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace; }
  </style>
  <rect width="1500" height="860" fill="#FFFFFF"/>
  <rect x="28" y="28" width="1444" height="804" rx="22" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="2"/>
  <text x="58" y="82" font-size="30" font-weight="700">Implemented exact nearest-city architecture</text>
  <text x="58" y="116" font-size="16" fill="#536174">One frozen byte capture flows through audited normalization, exact acceleration, optional proof, and a bounded receipt</text>
  <rect x="1168" y="62" width="260" height="38" rx="19" fill="#E7F5ED" stroke="#247A4D" stroke-width="1"/>
  <text x="1298" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#155A36">CURRENT · IMPLEMENTED</text>
