<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" fill="#172033" role="img" aria-labelledby="work-title work-description">
  <title id="work-title">Exact query work on four real source-bound cases</title>
  <desc id="work-description">A record-accounting chart showing 105 accelerated evaluations, 178659 record evaluations avoided by pruning, and 178764 full-scan evaluations across four oracle-matched queries, with an explicit worst-case warning.</desc>
  <style>
    text { font-family: Arial, Helvetica, Liberation Sans, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace; }
  </style>
  <rect width="1400" height="860" fill="#FFFFFF"/>
  <rect x="34" y="32" width="1332" height="796" rx="22" fill="#FFFFFF" stroke="#D7E0EA" stroke-width="2"/>
  <text x="66" y="86" font-size="30" font-weight="700">Exact query work on four real source-bound cases</text>
  <text x="66" y="120" font-size="16" fill="#536174">Traversal accounting from the checked artifact; full-scan results matched for every ordered top-3 result</text>
  <rect x="66" y="158" width="300" height="122" rx="14" fill="#E8F1FA" stroke="#2563A6" stroke-width="1"/>
  <text x="88" y="188" font-size="13" font-weight="700" fill="#184A7A">KD-TREE EVALUATIONS</text>
  <text class="mono" x="88" y="232" font-size="30" font-weight="700">105</text>
  <text x="88" y="258" font-size="13" fill="#536174">187 nodes visited across 4 queries</text>
  <rect x="388" y="158" width="300" height="122" rx="14" fill="#F5F8FC" stroke="#D7E0EA" stroke-width="1"/>
  <text x="410" y="188" font-size="13" font-weight="700" fill="#173B5F">FULL-SCAN EVALUATIONS</text>
  <text class="mono" x="410" y="232" font-size="30" font-weight="700">178,764</text>
  <text x="410" y="258" font-size="13" fill="#536174">44,691 records x 4 exact oracle queries</text>
  <rect x="710" y="158" width="624" height="122" rx="14" fill="#E7F5ED" stroke="#247A4D" stroke-width="1"/>
  <text x="734" y="188" font-size="13" font-weight="700" fill="#155A36">AVOIDED RECORD EVALUATIONS</text>
  <text class="mono" x="734" y="232" font-size="30" font-weight="700">178,659</text>
  <text x="1068" y="232" font-size="30" font-weight="700" fill="#155A36">99.94%</text>
  <text x="734" y="258" font-size="13" fill="#536174">Structural work reduction; this is not a latency benchmark</text>
  <text x="66" y="325" font-size="13" font-weight="700" fill="#536174">QUERY CASE</text>
  <text x="360" y="325" font-size="13" font-weight="700" fill="#536174">RECORD ACCOUNTING · each row totals 44,691</text>
