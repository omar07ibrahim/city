  <text x="1142" y="317" font-size="12" fill="#536174">evaluated</text>
  <rect x="1230" y="305" width="14" height="14" rx="2" fill="#247A4D"/>
  <text x="1252" y="317" font-size="12" fill="#536174">pruned</text>
