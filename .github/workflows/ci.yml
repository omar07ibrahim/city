name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: city-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
      - name: Set up exact quality Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.12.3"
      - name: Install hash-locked quality tools
        run: python -m pip install --require-hashes --no-deps -r requirements-ci.txt
      - name: Lint and format-check
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Strict type-check
        run: python -m mypy urbanlens tests

  runtime:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the hash-locked build backend
        run: python -m pip install --require-hashes --no-deps -r requirements-build.txt
      - name: Install the dependency-free package
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Run the complete test suite
        run: python -m unittest discover -s tests -v

  evidence:
    name: Evidence and distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COVERAGE_FILE: ${{ runner.temp }}/urbanlens.coverage
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          persist-credentials: false
      - name: Set up exact evidence Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.12.3"
      - name: Install the hash-locked verification toolchain
        run: python -m pip install --require-hashes --no-deps -r requirements-ci.txt
      - name: Enforce statement and branch coverage
        run: |
          python -m coverage erase
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report -m
      - name: Reproduce every evidence surface
        run: |
          python -m urbanlens.audit --check-manifest artifacts/data_quality/train.quality.json
          python -m urbanlens.visuals --check
          python -m urbanlens.spatial_evidence --check
          python -m urbanlens.spatial_visuals --check
      - name: Build release artifacts without isolation drift
        run: |
          python -m build --no-isolation --sdist --wheel --outdir "$RUNNER_TEMP/urbanlens-dist"
          rm -rf -- urbanlens.egg-info
      - name: Install and execute the built wheel outside its source tree
        run: |
          python -m venv "$RUNNER_TEMP/urbanlens-smoke"
          "$RUNNER_TEMP/urbanlens-smoke/bin/python" -m pip install \
            --no-deps --no-index "$RUNNER_TEMP"/urbanlens-dist/*.whl
          (
            cd "$RUNNER_TEMP"
            "$RUNNER_TEMP/urbanlens-smoke/bin/urbanlens-audit" \
              --dataset "$GITHUB_WORKSPACE/train.csv" \
              --check-manifest "$GITHUB_WORKSPACE/artifacts/data_quality/train.quality.json"
            "$RUNNER_TEMP/urbanlens-smoke/bin/urbanlens-nearest" \
              --dataset "$GITHUB_WORKSPACE/train.csv" \
              --lat -11.1 \
              --lon -77.6 \
              --k 3 \
              --verify > "$RUNNER_TEMP/nearest.json"
          )
          python - "$RUNNER_TEMP/nearest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="ascii"))
          assert receipt["proof"]["oracle"]["status"] == "match"
          assert [item["city_ascii"] for item in receipt["results"][:2]] == [
              "Huacho",
              "Huaura",
          ]
          assert [item["distance_m"] for item in receipt["results"][:2]] == [0, 0]
          PY
      - name: Reject tracked or untracked drift
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
